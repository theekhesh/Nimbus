[package]
name = "nimbus"
version = "0.1.0"
edition = "2021"
description = "Nimbus: a lightweight, privacy-first Linux browser"

[dependencies]
gtk4 = { version = "0.11", features = ["v4_14"] }
webkit6 = "0.6"
glib = "0.22"
once_cell = "1.19"
parking_lot = "0.12"
url = "2.5"
log = "0.4"
env_logger = "0.11"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = 3